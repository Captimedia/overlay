<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capti Control – Glace 1</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg-dark:#0a0e17;--bg-card:#111827;--bg-card-hover:#1a2234;--border:#1e293b;--border-light:#334155;--text:#f1f5f9;--text-muted:#94a3b8;--text-dim:#64748b;--accent:#3b82f6;--accent-glow:rgba(59,130,246,0.25);--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--ice-blue:#38bdf8;--purple:#a78bfa;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-dark);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,0.06) 0%,transparent 50%);pointer-events:none;z-index:0;}

  .header{position:relative;z-index:1;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(10,14,23,0.85);backdrop-filter:blur(12px);flex-wrap:wrap;gap:10px;}
  .header-left{display:flex;align-items:center;gap:14px;}
  .logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;box-shadow:0 4px 15px var(--accent-glow);}
  .header h1{font-size:20px;font-weight:700;letter-spacing:-0.5px;}
  .header h1 span{color:var(--text-muted);font-weight:400;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .btn-sync{padding:7px 14px;border-radius:8px;border:1px solid var(--orange);background:rgba(245,158,11,0.1);color:var(--orange);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .btn-sync:hover{background:rgba(245,158,11,0.2);}
  .refresh-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .refresh-btn:hover{background:var(--bg-card-hover);}
  .status-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:20px;font-size:12px;font-weight:500;color:var(--green);}
  .status-badge.error{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.25);color:var(--red);}
  .status-badge.loading{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.25);color:var(--orange);}
  .status-dot{width:7px;height:7px;background:currentColor;border-radius:50%;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.4);}50%{opacity:0.7;box-shadow:0 0 0 6px rgba(34,197,94,0);}}
  @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.3);}50%{box-shadow:0 0 0 4px rgba(239,68,68,0);}}

  .main{position:relative;z-index:1;padding:20px 24px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
  .glace-title{font-size:26px;font-weight:800;display:flex;align-items:center;gap:12px;}
  .glace-title .icon{width:38px;height:38px;border-radius:10px;background:rgba(56,189,248,0.15);color:var(--ice-blue);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .glace-title .arena{color:var(--text-muted);font-weight:400;font-size:18px;}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .panel-group{display:flex;flex-direction:column;gap:10px;}
  @media(max-width:900px){.panels{grid-template-columns:1fr;}}

  /* Scorebird Preview */
  .preview-wrapper{display:flex;flex-direction:column;gap:0;}
  .preview-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);padding:0 0 6px 2px;}
  .preview-frame{width:100%;height:50px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#000;}
  .preview-frame iframe{width:210%;height:210%;border:0;background:transparent;transform:scale(0.476);transform-origin:top left;}
  .preview-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;}

  .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .panel-header{padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:space-between;}
  .section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);}
  .panel-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border-radius:5px;}
  .panel-badge.live{background:rgba(239,68,68,0.15);color:var(--red);animation:pulse-red 2s infinite;}
  .panel-badge.next{background:rgba(34,197,94,0.12);color:var(--green);}

  .match-card{padding:16px 18px;}
  .match-card.empty{text-align:center;padding:36px 18px;color:var(--text-dim);font-size:15px;}
  .match-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--text-muted);flex-wrap:wrap;}
  .tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(59,130,246,0.12);color:var(--accent);}
  .tag.round{background:rgba(245,158,11,0.12);color:var(--orange);}
  .match-teams{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .team-logo{width:54px;height:54px;border-radius:50%;background:var(--bg-dark);border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--text-muted);transition:all 0.3s;overflow:hidden;}
  .team-logo img{width:100%;height:100%;object-fit:cover;}
  .team-name{font-size:14px;font-weight:600;text-align:center;line-height:1.2;}
  .score-display{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;}
  .score-display .sep{color:var(--text-dim);font-size:20px;}
  .score-sep{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--text-dim);padding:0 4px;align-self:flex-end;margin-bottom:8px;}
  .score-input{width:52px;padding:6px 4px;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;text-align:center;color:var(--text);background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;outline:none;-moz-appearance:textfield;transition:border-color 0.2s;}
  .score-input::-webkit-inner-spin-button,.score-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .score-input:focus{border-color:var(--accent);background:rgba(255,255,255,0.1);}
  .score-input::placeholder{color:var(--text-dim);}
  .score-input-sm{width:36px;padding:4px 2px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;text-align:center;color:var(--text);background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:5px;outline:none;-moz-appearance:textfield;}
  .score-input-sm::-webkit-inner-spin-button,.score-input-sm::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .score-input-sm:focus{border-color:var(--accent);background:rgba(255,255,255,0.1);}
  .score-input-sm::placeholder{color:var(--text-dim);}
  .match-time{text-align:center;margin-top:10px;font-size:13px;color:var(--text-dim);}

  .color-control{margin-top:12px;padding:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;}
  .color-control-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);margin-bottom:8px;}
  .color-teams{display:flex;gap:10px;}
  @media(max-width:600px){.color-teams{flex-direction:column;}}
  .color-team-row{flex:1;display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid var(--border);}
  .color-swatch{width:26px;height:26px;border-radius:6px;border:2px solid rgba(255,255,255,0.15);flex-shrink:0;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;position:relative;}
  .color-swatch:hover{transform:scale(1.15);box-shadow:0 0 12px rgba(255,255,255,0.2);}
  .color-picker-input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0;}
  .color-team-info{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
  .color-team-label{font-size:10px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
  .color-team-name-label{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .color-hex{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);cursor:pointer;}
  .color-hex:hover{color:var(--text-muted);}
  .color-hex-input{width:62px;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text);background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:4px;padding:2px 4px;outline:none;text-transform:uppercase;}
  .color-hex-input:focus{border-color:var(--accent);background:rgba(255,255,255,0.1);}
  .color-mode-toggle{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;}
  .color-mode-btn{padding:3px 9px;font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;border:none;cursor:pointer;background:transparent;color:var(--text-dim);transition:all 0.2s;}
  .color-mode-btn:hover{color:var(--text-muted);background:rgba(255,255,255,0.04);}
  .color-mode-btn.active{background:var(--accent);color:#fff;}

  .controls-row{display:flex;gap:8px;}
  .btn{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn:hover{background:var(--bg-card-hover);border-color:var(--border-light);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.success{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.3);color:var(--green);}
  .btn.success:hover{background:rgba(34,197,94,0.2);}
  .btn-full{width:100%;}

  .sponsor-box{padding:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .sponsor-box img{max-height:44px;max-width:100%;object-fit:contain;}

  .schedule-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .schedule-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
  .schedule-header h2{font-size:15px;font-weight:700;}
  .filter-tabs{display:flex;gap:4px;}
  .filter-tab{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;border:none;background:transparent;font-family:'Outfit',sans-serif;transition:all 0.2s;}
  .filter-tab:hover{color:var(--text-muted);background:rgba(255,255,255,0.04);}
  .filter-tab.active{color:var(--text);background:rgba(255,255,255,0.08);}
  .schedule-table{width:100%;border-collapse:collapse;}
  .schedule-table th{padding:8px 14px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);text-align:left;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02);}
  .schedule-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);}
  .schedule-table tr:hover td{background:rgba(255,255,255,0.02);}
  .status-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
  .status-pill.live{background:rgba(239,68,68,0.15);color:var(--red);}
  .status-pill.upcoming{background:rgba(59,130,246,0.12);color:var(--accent);}
  .status-pill.completed{background:rgba(255,255,255,0.06);color:var(--text-dim);}
  .status-pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
  .status-pill.live .dot{animation:pulse 2s infinite;}

  .toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;transform:translateY(80px);opacity:0;transition:all 0.35s cubic-bezier(0.16,1,0.3,1);z-index:100;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.success{border-color:rgba(34,197,94,0.3);}
  .toast.error{border-color:rgba(239,68,68,0.3);color:var(--red);}

  @media(max-width:600px){.main{padding:12px;}.header{padding:10px 14px;}.header h1{font-size:16px;}.controls-row{flex-wrap:wrap;}.btn{font-size:12px;padding:8px 10px;}.glace-title{font-size:20px;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .panel{animation:fadeUp 0.5s ease both;}.panel:nth-child(2){animation-delay:0.1s;}
  .schedule-panel{animation:fadeUp 0.5s ease both 0.2s;}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo-mark">C</div>
    <h1>Capti Control <span>· Tournoi</span></h1>
  </div>
  <div class="header-right">
    <button class="btn-sync" onclick="sendAction('refresh_horaire')">🔄 Sync Horaire</button>
    <button class="refresh-btn" onclick="loadDashboard()">🔄</button>
    <div class="status-badge loading" id="statusBadge">
      <div class="status-dot"></div>
      <span id="statusText">Chargement…</span>
    </div>
  </div>
</header>

<div class="main">
  <div class="glace-title">
    <div class="icon">🏒</div>
    <span>Glace 1</span>
    <span class="arena" id="arenaName"></span>
  </div>

  <div class="panels">
    <div class="panel-group">
      <div class="preview-wrapper">
        <div class="preview-label">Aperçu Scorebird – LIVE</div>
        <div class="preview-frame" id="livePreview"><div class="preview-empty">Aucun overlay</div></div>
      </div>
      <div class="panel" id="livePanel">
        <div class="panel-header">
          <div class="section-label">🔴 Match en cours</div>
          <div class="panel-badge live" id="liveBadge">LIVE</div>
        </div>
        <div id="liveContent" class="match-card empty">Chargement…</div>
      </div>
      <div id="sponsorLive" class="sponsor-box" style="display:none;"></div>
      <button class="btn success btn-full" onclick="doValidate()">✓ Valider</button>
    </div>
    <div class="panel-group">
      <div class="preview-wrapper">
        <div class="preview-label">Aperçu Scorebird – NEXT</div>
        <div class="preview-frame" id="selectedPreview"><div class="preview-empty">Aucun overlay</div></div>
      </div>
      <div class="panel" id="selectedPanel">
        <div class="panel-header">
          <div class="section-label">⏭ Prochain sélectionné</div>
          <div class="panel-badge next">NEXT</div>
        </div>
        <div id="selectedContent" class="match-card empty">Chargement…</div>
      </div>
      <div id="sponsorSelected" class="sponsor-box" style="display:none;"></div>
      <div class="controls-row">
        <button class="btn" onclick="sendAction('prev_g1')">◀ Précédent</button>
        <button class="btn" onclick="sendAction('next_g1')">Suivant ▶</button>
      </div>
    </div>
  </div>

  <div class="schedule-panel">
    <div class="schedule-header">
      <h2>📋 Horaire</h2>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterSchedule(this,'all')">Tous</button>
        <button class="filter-tab" onclick="filterSchedule(this,'live')">Live</button>
        <button class="filter-tab" onclick="filterSchedule(this,'upcoming')">À venir</button>
        <button class="filter-tab" onclick="filterSchedule(this,'completed')">Complétés</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="schedule-table">
        <thead><tr><th>#</th><th>Heure</th><th>Division</th><th>Ronde</th><th>Visiteur</th><th>Score</th><th>Local</th><th>Statut</th></tr></thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwJuGxvTzJJOidCZlNQgdBA4YWsfGSI2CRqPJPYDCGYVr8z22ZzBaIe437EwPjxZZowlw/exec";
  const GLACE_KEY = "glace1";
  const GLACE_NUM = 1;
  const SCOREBIRD = 21159;
  const ACTION_SUFFIX = "g1";

  let dashData = null;
  let currentFilter = "all";

  function jsonp(url){return new Promise((res,rej)=>{const cb="_cb_"+Math.random().toString(36).slice(2);const to=setTimeout(()=>{delete window[cb];s.remove();rej(new Error("Timeout"));},15000);window[cb]=d=>{clearTimeout(to);delete window[cb];s.remove();res(d);};const s=document.createElement("script");s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;s.onerror=()=>{clearTimeout(to);delete window[cb];rej(new Error("err"));};document.body.appendChild(s);});}

  function sendAction(action,extra){
    let url=GAS_URL+"?action="+encodeURIComponent(action);
    if(extra)Object.keys(extra).forEach(k=>url+="&"+k+"="+encodeURIComponent(extra[k]));
    showToast("⏳ "+action+"…");
    const s=document.createElement("script");s.src=url+"&callback=_ad";document.body.appendChild(s);setTimeout(()=>s.remove(),5000);
    new Image().src=url;
    setTimeout(()=>{loadDashboard();showToast("✓ "+action+" envoyé");},1500);
  }
  window._ad=function(){};

  function doValidate(){showToast("✓ Validation…");sendAction("live_"+ACTION_SUFFIX);setTimeout(()=>sendAction("next_"+ACTION_SUFFIX),500);}
  function changeColor(side,mode,target){sendAction("color",{glace:GLACE_NUM,side,mode,target:target||"live"});showToast("🎨 "+side+" → "+mode);}

  // Update score in Matchs sheet
  function updateScore(horaireId,side,value){
    sendAction("update_score",{horaire_id:horaireId,side:side,score:value});
    showToast("⚽ #"+horaireId+" "+side+" → "+value);
  }

  // Color picker: update hex in Équipes sheet
  function pickColor(teamName,colorType,hexValue){
    const hex=hexValue.replace("#","").toUpperCase();
    sendAction("update_team_color",{team:teamName,type:colorType,hex:hex});
    showToast("🎨 "+teamName+" → #"+hex);
  }

  // Hex text input: submit on Enter or blur
  function submitHex(teamName,colorType,inputEl){
    let hex=inputEl.value.replace(/[^0-9A-Fa-f]/g,"").toUpperCase();
    if(hex.length!==6&&hex.length!==3)return; // ignore invalid
    if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    inputEl.value=hex;
    sendAction("update_team_color",{team:teamName,type:colorType,hex:hex});
    showToast("🎨 "+teamName+" → #"+hex);
  }

  async function loadDashboard(){
    setStatus("loading","Chargement…");
    try{
      const data=await jsonp(GAS_URL+"?dashboard=1");
      if(data.error)throw new Error(data.error);
      dashData=data;
      renderGlace();
      renderSchedule(currentFilter);
      setStatus("ok","Connecté · "+new Date().toLocaleTimeString("fr-CA"));
    }catch(err){console.error(err);setStatus("error","Erreur");showToast("❌ Erreur","error");}
  }

  function setStatus(t,txt){
    document.getElementById("statusBadge").className="status-badge "+(t==="ok"?"":t);
    document.getElementById("statusText").textContent=txt;
  }

  // Scale iframes to fit container width

  function renderGlace(){
    const g=dashData[GLACE_KEY];if(!g)return;
    const name=g.glace_name||"";
    document.getElementById("arenaName").textContent=name?"("+name+")":"";

    const badge=document.getElementById("liveBadge");
    if(g.live){badge.style.display="";badge.className="panel-badge live";badge.textContent="LIVE";}
    else{badge.style.display="none";}

    document.getElementById("liveContent").outerHTML=renderCard(g.live,true);
    document.getElementById("selectedContent").outerHTML=renderCard(g.selected,false);

    // Scorebird preview iframes
    const livePreview=document.getElementById("livePreview");
    if(g.live&&g.live.url_scorebird){
      livePreview.innerHTML='<iframe src="'+g.live.url_scorebird+'" allow="autoplay" allowfullscreen></iframe>';
    }else{livePreview.innerHTML='<div class="preview-empty">Aucun overlay</div>';}

    const selPreview=document.getElementById("selectedPreview");
    if(g.selected&&g.selected.url_scorebird){
      selPreview.innerHTML='<iframe src="'+g.selected.url_scorebird+'" allow="autoplay" allowfullscreen></iframe>';
    }else{selPreview.innerHTML='<div class="preview-empty">Aucun overlay</div>';}

    // Sponsor logos
    const sL=document.getElementById("sponsorLive");
    if(g.live&&g.live.url_commanditaire){sL.style.display="flex";sL.innerHTML='<img src="'+g.live.url_commanditaire+'" alt="Commanditaire">';}else{sL.style.display="none";}
    const sS=document.getElementById("sponsorSelected");
    if(g.selected&&g.selected.url_commanditaire){sS.style.display="flex";sS.innerHTML='<img src="'+g.selected.url_commanditaire+'" alt="Commanditaire">';}else{sS.style.display="none";}

  }

  function renderCard(match,isLive){
    const id=isLive?"liveContent":"selectedContent";
    if(!match)return '<div id="'+id+'" class="match-card empty">Aucun match</div>';
    const eq=dashData.equipes||{};
    const gc=(n,m)=>{const t=eq[n];if(!t)return"666666";return m==="Primary"?(t.primary_color||"666666"):(t.secondary_color||"999999");};
    const ac=gc(match.away,match.away_color_mode||"Secondary");
    const hc=gc(match.home,match.home_color_mode||"Primary");
    const al=match.away_logo?'<img src="'+match.away_logo+'">':(match.away||"?").charAt(0);
    const hl=match.home_logo?'<img src="'+match.home_logo+'">':(match.home||"?").charAt(0);
    const tgt=isLive?"live":"selected";
    const am=match.away_color_mode||"Secondary";
    const hm=match.home_color_mode||"Primary";
    const awayColorType=am.toLowerCase();
    const homeColorType=hm.toLowerCase();
    const awayTeam=match.away||"";
    const homeTeam=match.home||"";
    const awayScoreVal=(match.away_score!=null&&match.away_score!=="")?""+match.away_score:"";
    const homeScoreVal=(match.home_score!=null&&match.home_score!=="")?""+match.home_score:"";
    const hid=match.horaire_id;

    return '<div id="'+id+'" class="match-card">'+
      '<div class="match-meta"><span class="tag">'+(match.division||"")+'</span>'+
      (match.round?'<span class="tag round">'+match.round+'</span>':'')+
      '<span>#'+match.horaire_id+'</span></div>'+
      '<div class="match-teams">'+
        '<div class="team">'+
          '<div class="team-logo" style="border-color:#'+ac+';box-shadow:0 0 10px #'+ac+'55">'+al+'</div>'+
          '<div class="team-name">'+(match.away||"—")+'</div>'+
          '<input type="number" class="score-input" value="'+awayScoreVal+'" min="0" placeholder="–" onchange="updateScore('+hid+',\'away\',this.value)">'+
        '</div>'+
        '<div class="score-sep">–</div>'+
        '<div class="team">'+
          '<div class="team-logo" style="border-color:#'+hc+';box-shadow:0 0 10px #'+hc+'55">'+hl+'</div>'+
          '<div class="team-name">'+(match.home||"—")+'</div>'+
          '<input type="number" class="score-input" value="'+homeScoreVal+'" min="0" placeholder="–" onchange="updateScore('+hid+',\'home\',this.value)">'+
        '</div>'+
      '</div>'+
      '<div class="match-time">'+(match.date?formatDateFR(match.date):"")+" "+(match.time||"")+'</div>'+
      '<div class="color-control"><div class="color-control-title">🎨 Couleurs Scorebird</div><div class="color-teams">'+
        // Away team color row
        '<div class="color-team-row">'+
          '<div class="color-swatch" style="background:#'+ac+'">'+
            '<input type="color" class="color-picker-input" value="#'+ac+'" onchange="pickColor(\''+awayTeam.replace(/'/g,"\\'")+'\',\''+awayColorType+'_color\',this.value)">'+
          '</div>'+
          '<div class="color-team-info"><span class="color-team-label">Visiteur</span><span class="color-team-name-label">'+(match.away||"—")+'</span>'+
            '<span class="color-hex">#<input type="text" class="color-hex-input" value="'+ac+'" maxlength="6" onkeydown="if(event.key===\'Enter\'){submitHex(\''+awayTeam.replace(/'/g,"\\'")+'\',\''+awayColorType+'_color\',this)}" onblur="submitHex(\''+awayTeam.replace(/'/g,"\\'")+'\',\''+awayColorType+'_color\',this)"></span>'+
          '</div>'+
          '<div class="color-mode-toggle"><button class="color-mode-btn '+(am==="Primary"?"active":"")+'" onclick="changeColor(\'away\',\'Primary\',\''+tgt+'\')">Pri</button><button class="color-mode-btn '+(am==="Secondary"?"active":"")+'" onclick="changeColor(\'away\',\'Secondary\',\''+tgt+'\')">Sec</button></div>'+
        '</div>'+
        // Home team color row
        '<div class="color-team-row">'+
          '<div class="color-swatch" style="background:#'+hc+'">'+
            '<input type="color" class="color-picker-input" value="#'+hc+'" onchange="pickColor(\''+homeTeam.replace(/'/g,"\\'")+'\',\''+homeColorType+'_color\',this.value)">'+
          '</div>'+
          '<div class="color-team-info"><span class="color-team-label">Local</span><span class="color-team-name-label">'+(match.home||"—")+'</span>'+
            '<span class="color-hex">#<input type="text" class="color-hex-input" value="'+hc+'" maxlength="6" onkeydown="if(event.key===\'Enter\'){submitHex(\''+homeTeam.replace(/'/g,"\\'")+'\',\''+homeColorType+'_color\',this)}" onblur="submitHex(\''+homeTeam.replace(/'/g,"\\'")+'\',\''+homeColorType+'_color\',this)"></span>'+
          '</div>'+
          '<div class="color-mode-toggle"><button class="color-mode-btn '+(hm==="Primary"?"active":"")+'" onclick="changeColor(\'home\',\'Primary\',\''+tgt+'\')">Pri</button><button class="color-mode-btn '+(hm==="Secondary"?"active":"")+'" onclick="changeColor(\'home\',\'Secondary\',\''+tgt+'\')">Sec</button></div>'+
        '</div>'+
      '</div></div></div>';
  }

  function renderSchedule(filter){
    if(!dashData||!dashData.matchs)return;
    const tbody=document.getElementById("scheduleBody");
    let list=dashData.matchs.filter(m=>Number(m.scorebird)===SCOREBIRD);
    if(filter!=="all")list=list.filter(m=>{
      if(filter==="live")return m.statut==="Live";
      if(filter==="upcoming")return m.statut==="À venir";
      if(filter==="completed")return m.statut==="Complété";
    });
    tbody.innerHTML=list.map(m=>{
      const cls=m.statut==="Live"?"live":m.statut==="À venir"?"upcoming":"completed";
      const asVal=(m.away_score!=null&&m.away_score!=="")?""+m.away_score:"";
      const hsVal=(m.home_score!=null&&m.home_score!=="")?""+m.home_score:"";
      return '<tr><td style="font-family:\'JetBrains Mono\',monospace;color:var(--text-dim)">'+m.horaire_id+'</td><td>'+(m.time||"")+'</td><td>'+(m.division||"")+'</td><td>'+(m.round||"")+'</td><td style="font-weight:600">'+(m.away||"")+'</td>'+
        '<td style="text-align:center"><input type="number" class="score-input-sm" value="'+asVal+'" min="0" placeholder="–" onchange="updateScore('+m.horaire_id+',\'away\',this.value)"> <span style="color:var(--text-dim)">–</span> <input type="number" class="score-input-sm" value="'+hsVal+'" min="0" placeholder="–" onchange="updateScore('+m.horaire_id+',\'home\',this.value)"></td>'+
        '<td style="font-weight:600">'+(m.home||"")+'</td><td><span class="status-pill '+cls+'"><span class="dot"></span>'+(m.statut||"")+'</span></td></tr>';
    }).join("");
  }

  function filterSchedule(btn,f){document.querySelectorAll(".filter-tab").forEach(t=>t.classList.remove("active"));btn.classList.add("active");currentFilter=f;renderSchedule(f);}
  function formatDateFR(d){if(!d)return"";const dt=new Date(d+"T12:00:00");return isNaN(dt)?d:dt.toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"});}
  function showToast(msg,type){const t=document.getElementById("toast");t.textContent=msg;t.className="toast "+(type||"success")+" show";clearTimeout(t._t);t._t=setTimeout(()=>t.className="toast",2500);}

  loadDashboard();
</script>
</body>
</html>
